# Must match the project name in the Cloudflare dashboard.
name = "my-1st-project"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Keep variables added in the dashboard when Git deploys run `wrangler deploy`
# (otherwise plain-text variables not listed here are removed on every deploy).
keep_vars = true

# Serves public/ (index.html, app.js, styles.css). Requests that don't match a file go to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

# Secrets are NOT stored here. Add them in the dashboard (Settings → Variables and Secrets) or with:
#   npx wrangler secret put NVIDIA_API_KEY
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# For local dev, copy .dev.vars.example to .dev.vars.
